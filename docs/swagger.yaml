    get:
      description: GeneratePassword handles the HTTP request for generating a password.
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Generate Random Password
      tags:
      - Password
  /v1/links/shorten:
    post:
      consumes:
      - application/json
